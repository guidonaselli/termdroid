name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release APKs and App Bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare Assets & Checksums
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/termdroid-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-assets/termdroid-x86_64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-assets/termdroid-universal.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/termdroid.aab
          cd release-assets
          sha256sum *.apk *.aab > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/termdroid-arm64-v8a.apk
            release-assets/termdroid-x86_64.apk
            release-assets/termdroid-universal.apk
            release-assets/termdroid.aab
            release-assets/checksums.txt
          generate_release_notes: true
