name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release APKs and App Bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare Assets & Checksums
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/termdroid-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-assets/termdroid-x86_64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-assets/termdroid-universal.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/termdroid.aab
          cd release-assets
          sha256sum -- *.apk *.aab > checksums.txt

      - name: Validate release assets
        run: python scripts/verify_release_assets.py release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes --title "Termdroid $tag"
          for asset in \
            termdroid-arm64-v8a.apk \
            termdroid-x86_64.apk \
            termdroid-universal.apk \
            termdroid.aab \
            checksums.txt
          do
            gh release upload "$tag" "release-assets/$asset" --clobber
          done

          actual="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in \
            termdroid-arm64-v8a.apk \
            termdroid-x86_64.apk \
            termdroid-universal.apk \
            termdroid.aab \
            checksums.txt
          do
            grep -Fxq "$asset" <<<"$actual" || { echo "Falta asset publicado: $asset"; exit 1; }
          done
